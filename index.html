<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Planetario 3D Cinematografico — Esplora Terra, Sistema Solare, Via Lattea e oltre" />
    <title>Planetario 3D — Interstellar Edition</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="icon" href="/icons/favicon-128.png" type="image/png" sizes="128x128" />
    <link rel="apple-touch-icon" href="/icons/planetario-192.png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1A2A6C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; overflow: hidden; background: #03050A; color: #EAF6FF; }
      #app { position: relative; width: 100vw; height: 100vh; }
      #canvas { display: block; width: 100%; height: 100%; }
      #loading-screen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: #03050A; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="ui-root"></div>
      <div id="loading-screen">
        <div class="loading-inner">
          <img class="loading-logo" src="/icons/planetario-192.png" width="96" height="96" alt="" decoding="async" />
          <div class="loading-ring"></div>
          <h1>PLANETARIO</h1>
          <p class="loading-sub">Interstellar Edition</p>
          <div class="loading-bar"><div class="loading-progress"></div></div>
          <p class="loading-status">Inizializzazione...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
